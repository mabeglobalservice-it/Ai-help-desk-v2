name: Frontend tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # NEXT_PUBLIC_* est inline dans le bundle client au moment du build
      # (voir frontend/Dockerfile) — une valeur factice suffit ici, ce build
      # ne fait aucun appel reseau, il verifie seulement que la compilation
      # TypeScript/Next.js reussit.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
