services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-help-desk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_help_desk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # docs/14-plan-deploiement-cloud.md §3, docs/07-architecture-logicielle.md
  # §"Files d'attente (BullMQ)" : file BullMQ "notifications-delivery" (voir
  # backend/src/notifications-delivery/). Optionnel en dev local (RM-05) :
  # sans ce service, le backend retombe automatiquement sur l'envoi
  # synchrone des notifications — `docker compose up` sans Redis fonctionne
  # toujours, juste sans découplage asynchrone.
  redis:
    image: redis:7
    container_name: ai-help-desk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # docs/07-architecture-logicielle.md §10, docs/14-plan-deploiement-cloud.md
  # §3. Nécessite `backend/.env` (voir README, section "Configurer les
  # variables d'environnement") — absent, `docker compose up` échoue au
  # démarrage de ce service avec une erreur explicite plutôt qu'un
  # comportement dégradé silencieux (contrairement à Redis, la config de
  # base — DATABASE_URL, JWT_SECRET — n'est pas optionnelle).
  backend:
    build:
      context: ./backend
    container_name: ai-help-desk-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # Surcharge deliberee de DATABASE_URL/REDIS_URL : `backend/.env` (copie
    # de .env.example) pointe vers `localhost`, correct pour `npm run
    # start:dev` en local mais faux ici — a l'interieur du reseau Docker
    # Compose, le backend doit joindre postgres/redis par leur nom de
    # service, pas par "localhost" (qui, dans son propre conteneur, ne
    # designerait que lui-meme). `environment:` a priorite sur `env_file:`
    # pour une meme cle (comportement standard de Compose), donc un seul
    # fichier .env reste suffisant pour les deux usages (local et Docker).
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_help_desk?schema=public
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      # Pas de `condition: service_healthy` ici : Redis reste optionnel
      # (RM-05) même en Docker — le backend doit démarrer, migrer et servir
      # des requêtes que Redis soit prêt, en échec, ou absent.
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        # docs/07 §10 : NEXT_PUBLIC_API_URL est inline dans le bundle client
        # au moment du build (voir frontend/Dockerfile) — surchargez cette
        # variable d'environnement avant `docker compose build` si le
        # backend n'est pas accessible sur localhost:3000 depuis le
        # navigateur des utilisateurs (ex. déploiement multi-hôtes).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: ai-help-desk-frontend
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
